# Shared published files: Madlab already serves this directory via its root.
# Preserve Urban's existing crawler policy and advertise the canonical archive.
location = /robots.txt {
    alias /var/www/madlab/site/punpiti/urban-root-robots.txt;
    default_type text/plain;
}

location = /punpiti {
    return 301 /punpiti/$is_args$args;
}

location /punpiti/ {
    root /var/www/madlab/site;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
}
